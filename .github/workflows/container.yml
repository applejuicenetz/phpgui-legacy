name: 'container'

on:
  push:
    branches:
      - main
  release:
    types: [ released ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USER || secrets.GHCR_USER || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=legacy,enable=${{ github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.vendor=appleJuiceNETZ
            org.opencontainers.image.url=https://applejuicenet.cc

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.platform }} by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=legacy-${{ matrix.arch }}
          cache-to: type=gha,scope=legacy-${{ matrix.arch }},mode=max
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          test -n "$DIGEST"
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_HUB_USER: ${{ vars.DOCKER_HUB_USER || secrets.DOCKER_HUB_USER }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USER || secrets.GHCR_USER || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Login to Docker Hub
        if: env.DOCKER_HUB_USER != '' && env.DOCKER_HUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_HUB_USER }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=legacy,enable=${{ github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.vendor=appleJuiceNETZ
            org.opencontainers.image.url=https://applejuicenet.cc

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish multi-platform image to ghcr.io
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          shopt -s nullglob
          digests=(/tmp/digests/*)
          test "${#digests[@]}" -eq 2
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          mapfile -t tags < <(jq -r --arg image "$image" '.tags[] | select(startswith($image + ":"))' <<< "$META_JSON")
          test "${#tags[@]}" -gt 0
          tag_args=()
          digest_args=()
          for tag in "${tags[@]}"; do tag_args+=(-t "$tag"); done
          for digest in "${digests[@]}"; do digest_args+=("$image@sha256:${digest##*/}"); done
          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"

      - name: Copy image to regular phpgui package
        env:
          VERSION_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'legacy' }}
        run: |
          source="ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION_TAG"
          target="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/phpgui:$VERSION_TAG"
          docker buildx imagetools create -t "$target" "$source"

      - name: Copy multi-platform image to Docker Hub
        if: env.DOCKER_HUB_USER != '' && env.DOCKER_HUB_TOKEN != ''
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          image="docker.io/${GITHUB_REPOSITORY,,}"
          mapfile -t tags < <(jq -r --arg image "$image" '.tags[] | select(startswith($image + ":"))' <<< "$META_JSON")
          test "${#tags[@]}" -gt 0
          for tag in "${tags[@]}"; do
            source="ghcr.io/${GITHUB_REPOSITORY,,}:${tag##*:}"
            docker buildx imagetools create -t "$tag" "$source"
            regular="docker.io/${GITHUB_REPOSITORY_OWNER,,}/phpgui:${tag##*:}"
            docker buildx imagetools create -t "$regular" "$source"
          done
